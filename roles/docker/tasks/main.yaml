# Installs Docker Engine on Ubuntu from Docker's official apt repository,
# following https://docs.docker.com/engine/install/ubuntu/

- name: Install apt repository prerequisites
  apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create the apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download the Docker apt GPG key
  command:
    cmd: curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    creates: /etc/apt/keyrings/docker.asc

- name: Ensure the Docker apt GPG key is world-readable
  file:
    path: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Configure the Docker apt repository
  template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"

- name: Install Docker Engine
  apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Ensure the Docker service is running and enabled
  systemd:
    name: docker
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"

# The user module has no documented "append" flag, so use usermod -aG to add
# users to the docker group without clobbering their other supplementary groups.
- name: Add users to the docker group
  command:
    cmd: usermod -aG docker {{ item }}
  loop: "{{ docker_users }}"
  when: docker_users
