# Ubuntu release codename for the Docker apt repository.
# Defaults to the latest LTS ("noble" = 24.04). Tack has no codename fact, so
# override this for other releases (e.g. "jammy" for 22.04).
docker_apt_release: noble

# Docker apt repository channel: stable, test, or nightly.
docker_apt_channel: stable

# Packages installed from the Docker apt repository.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Desired state of the docker service.
docker_service_state: started
docker_service_enabled: true

# Users to grant Docker access by adding them to the "docker" group.
# Note: membership takes effect on the user's next login/session.
docker_users: []
