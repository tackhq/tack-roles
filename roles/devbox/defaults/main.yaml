# --- System CLI packages (all available in Ubuntu 24.04 universe) ---
devbox_packages:
  - zsh
  - vim
  - neovim
  - tmux
  - git
  - fd-find            # binary is `fdfind` on Ubuntu (symlinked to `fd` below)
  - silversearcher-ag  # `ag`
  - ripgrep            # `rg`
  - fzf
  - git-delta          # `delta`
  - bat                # binary is `batcat` on Ubuntu (symlinked to `bat` below)
  - gh
  - zoxide
  - eza
  - jq
  - htop
  - tree
  - direnv
  - curl
  - wget
  - unzip
  - build-essential
  - ca-certificates

# Directory on PATH for the fd/bat symlinks and the zellij binary.
devbox_bin_dir: /usr/local/bin

# zellij (not in apt) is installed from its latest GitHub release for the
# host's architecture.

# --- Per-user shell setup (empty list => packages only, no per-user changes) ---
# Add usernames to install oh-my-zsh + powerlevel10k, a managed ~/.zshrc, a
# curated ~/.vimrc, and set zsh as their login shell.
devbox_users: []
devbox_home_base: /home
devbox_login_shell: /usr/bin/zsh

devbox_omz_repo: https://github.com/ohmyzsh/ohmyzsh.git
devbox_p10k_repo: https://github.com/romkatv/powerlevel10k.git
devbox_fzf_hist_repo: https://github.com/joshskidmore/zsh-fzf-history-search.git

devbox_zsh_theme: powerlevel10k/powerlevel10k
# Rendered verbatim into plugins=(...). Space-separated (no template loops).
devbox_zsh_plugins: "git terraform kubectl aws wd zsh-fzf-history-search"
