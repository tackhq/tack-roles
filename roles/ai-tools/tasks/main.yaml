# Provisions an AI stack on Ubuntu: Claude Code + omp (oh-my-pi) coding agents
# and the MCPJungle MCP gateway, with MCP servers running in Docker.

# --- Prerequisites ---

- name: Install prerequisites
  apt:
    name:
      - curl
      - gnupg
      - ca-certificates
      - tar
      - unzip
      - jq
    state: present
    update_cache: true

- name: Create the apt keyrings directory
  file:
    path: "{{ ai_tools_keyrings_dir }}"
    state: directory
    mode: "0755"

# --- Claude Code (Anthropic signed apt repo) ---

- name: Download the Claude Code apt GPG key
  command:
    cmd: "curl -fsSL {{ ai_tools_claude_key_url }} -o {{ ai_tools_keyrings_dir }}/claude-code.asc"
    creates: "{{ ai_tools_keyrings_dir }}/claude-code.asc"

- name: Ensure the Claude Code key is world-readable
  file:
    path: "{{ ai_tools_keyrings_dir }}/claude-code.asc"
    mode: "0644"

- name: Configure the Claude Code apt repository
  template:
    src: claude-code.list.j2
    dest: /etc/apt/sources.list.d/claude-code.list
    mode: "0644"

- name: Install Claude Code
  apt:
    name: claude-code
    state: present
    update_cache: true

# --- omp (oh-my-pi) ---
# --binary installs a self-contained prebuilt binary (no Bun runtime needed);
# PI_INSTALL_DIR places it system-wide.
- name: Install omp (oh-my-pi)
  command:
    cmd: "sh -c 'curl -fsSL https://omp.sh/install | PI_INSTALL_DIR={{ ai_tools_omp_install_dir }} sh -s -- --binary'"
    creates: "{{ ai_tools_omp_install_dir }}/omp"

# --- MCPJungle gateway (install from GitHub release) ---

- name: Download the MCPJungle release tarball
  command:
    cmd: "curl -fsSL https://github.com/mcpjungle/MCPJungle/releases/download/{{ ai_tools_mcpjungle_version }}/mcpjungle_Linux_{{ ai_tools_mcpjungle_arch }}.tar.gz -o /tmp/mcpjungle.tar.gz"
    creates: "{{ ai_tools_bin_dir }}/mcpjungle"

- name: Extract the mcpjungle binary onto the PATH
  command:
    cmd: "tar -xzf /tmp/mcpjungle.tar.gz -C {{ ai_tools_bin_dir }} mcpjungle"
    creates: "{{ ai_tools_bin_dir }}/mcpjungle"

- name: Ensure mcpjungle is executable
  file:
    path: "{{ ai_tools_bin_dir }}/mcpjungle"
    mode: "0755"

# --- MCPJungle service ---
# The gateway runs as ai_tools_mcp_user so it can read ~/.mcp/<name>/env and
# start MCP servers with Docker.

- name: Require ai_tools_mcp_user
  assert:
    that: ai_tools_mcp_user != ""
    fail_msg: "set ai_tools_mcp_user: the MCP gateway runs as that (existing) user"

- name: Require Docker (MCP servers run in containers)
  command:
    cmd: "sh -c 'command -v docker >/dev/null || { echo \"ai-tools needs Docker: apply the docker role first\" >&2; exit 1; }'"

- name: Add the MCP user to the docker group
  command:
    cmd: "sh -c 'id -nG {{ ai_tools_mcp_user }} | grep -qw docker || usermod -aG docker {{ ai_tools_mcp_user }}'"

- name: Create the MCP directory
  file:
    path: "{{ ai_tools_home_base }}/{{ ai_tools_mcp_user }}/.mcp"
    state: directory
    owner: "{{ ai_tools_mcp_user }}"
    mode: "0700"

- name: Install the MCP server catalog
  copy:
    src: mcp-catalog/
    dest: "{{ ai_tools_mcp_catalog_dir }}/"
    mode: "0644"

- name: Install mcp-sync
  copy:
    src: mcp-sync
    dest: "{{ ai_tools_bin_dir }}/mcp-sync"
    mode: "0755"

- name: Install the mcpjungle systemd unit
  template:
    src: mcpjungle.service.j2
    dest: /etc/systemd/system/mcpjungle.service
    mode: "0644"
  register: mcpjungle_unit

- name: Enable and start mcpjungle
  systemd:
    name: mcpjungle
    state: started
    enabled: true
    daemon_reload: true

# Restart right away (not via a handler) so the sync below talks to the
# gateway with its new user, address and database.
- name: Restart mcpjungle after a unit change
  systemd:
    name: mcpjungle
    state: restarted
    daemon_reload: true
  when: mcpjungle_unit.changed

- name: Wait for the mcpjungle gateway to accept connections
  wait_for:
    type: command
    cmd: "curl -s -o /dev/null http://127.0.0.1:{{ ai_tools_mcpjungle_port }}/"
    timeout: 60

# --- Register MCP servers ---
# Creates ~/.mcp/<name>/env for each server and registers the ones whose
# credentials are filled in. Fill them in later and run `mcp-sync` as the MCP
# user (or re-run the play).
- name: Sync MCP servers into the gateway
  command:
    cmd: "runuser -u {{ ai_tools_mcp_user }} -- env MCPJUNGLE_REGISTRY=http://127.0.0.1:{{ ai_tools_mcpjungle_port }} MCP_CATALOG={{ ai_tools_mcp_catalog_dir }} {{ ai_tools_bin_dir }}/mcp-sync {{ ai_tools_mcp_servers }}"

# --- Per-user Claude Code wiring to the gateway (empty list => skipped) ---
# Idempotent: only adds the server if the user doesn't already have it.
- name: Point each user's Claude Code at the MCPJungle gateway
  command:
    cmd: "runuser -u {{ item }} -- sh -c 'claude mcp get mcpjungle >/dev/null 2>&1 || claude mcp add --transport http mcpjungle http://localhost:{{ ai_tools_mcpjungle_port }}/mcp --scope user'"
  loop: "{{ ai_tools_users }}"
  when: ai_tools_users
