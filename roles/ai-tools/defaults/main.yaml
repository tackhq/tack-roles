ai_tools_bin_dir: /usr/local/bin
ai_tools_keyrings_dir: /etc/apt/keyrings

# --- Claude Code (Anthropic signed apt repo) ---
ai_tools_claude_channel: stable            # stable | latest
ai_tools_claude_key_url: https://downloads.claude.ai/keys/claude-code.asc

# --- omp / oh-my-pi (self-contained prebuilt binary, system-wide) ---
ai_tools_omp_install_dir: /usr/local/bin

# --- MCPJungle gateway ---
# The download task references version/arch directly (tack interpolation is
# single-pass and won't expand a var nested inside another var's value).
ai_tools_mcpjungle_version: "0.4.6"
ai_tools_mcpjungle_arch: x86_64            # x86_64 | arm64
ai_tools_mcpjungle_port: 8080
# Address the gateway listens on. 127.0.0.1 keeps it on this machine; set
# "0.0.0.0" (or "") to listen on all interfaces. Dev mode has no auth, so only
# open it on a network you trust.
ai_tools_mcpjungle_listen: 127.0.0.1

# --- MCP servers ---
# The gateway runs as this existing user (required). Credentials live in
# ~/.mcp/<name>/env of that user, and it is added to the docker group.
ai_tools_mcp_user: ""
ai_tools_home_base: /home

# Servers to enable, space-separated. Catalog: context7, sequential-thinking,
# jira, aws-api, jenkins (see files/mcp-catalog). Any ~/.mcp/<name>/spec is
# enabled too. A server is registered once its env file is filled in.
ai_tools_mcp_servers: "context7 sequential-thinking"
ai_tools_mcp_catalog_dir: /usr/local/share/mcp-catalog
# Seconds MCPJungle waits for a server to start (first docker run can be slow).
ai_tools_mcp_init_timeout: 120

# --- Per-user Claude Code wiring to the gateway (empty => skipped) ---
# Add usernames to point their Claude Code at the MCPJungle endpoint.
ai_tools_users: []
